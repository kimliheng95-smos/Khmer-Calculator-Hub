<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Discount Calculator | Khmer Calculator Hub</title>

    <meta
      name="description"
      content="Calculate discounts, sale prices and savings quickly and easily with Khmer Calculator Hub. Free discount calculator."
    />

    <meta
      name="keywords"
      content="Discount Calculator, discount calculator Cambodia, sale price calculator, discount percentage, គណនាបញ្ចុះតម្លៃ, Khmer Calculator"
    />

    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://kimliheng95-smos.github.io/Khmer-Calculator-Hub/calculators/discount.html"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Discount Calculator | Khmer Calculator Hub"
    />

    <meta
      property="og:description"
      content="Calculate discounts, sale prices and savings quickly and easily with Khmer Calculator Hub."
    />

    <meta
      property="og:url"
      content="https://kimliheng95-smos.github.io/Khmer-Calculator-Hub/calculators/discount.html"
    />

    <meta property="og:site_name" content="Khmer Calculator Hub" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Main CSS -->
    <link rel="stylesheet" href="../css/style.css" />

    <style>
      .calculator-page {
        background: #f8fafc;
        min-height: calc(100vh - 76px);
      }

      .calculator-container {
        max-width: 850px;
        margin: auto;
      }

      .calculator-box {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 15px 40px rgba(15, 23, 42, 0.06);
      }

      .result-box {
        display: none;
        margin-top: 25px;
        padding: 25px;
        background: #eff6ff;
        border-radius: 15px;
        text-align: center;
      }

      .result-box h2 {
        font-size: 42px;
        font-weight: 800;
        color: #2563eb;
      }

      .result-box h3 {
        font-size: 30px;
        font-weight: 700;
        color: #2563eb;
      }

      /* ================= HISTORY ================= */

      .history-box {
        margin-top: 25px;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 15px 40px rgba(15, 23, 42, 0.06);
      }

      .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .history-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        font-size: 20px;
        font-weight: 700;
      }

      .history-title i {
        color: #2563eb;
      }

      .history-item {
        background: #f8fafc;
        transition: 0.2s;
      }

      .history-item:hover {
        transform: translateY(-2px);
      }

      .history-calculator {
        font-weight: 700;
        color: #1e293b;
      }

      .history-result {
        font-size: 16px;
        font-weight: 600;
        color: #2563eb;
      }

      .history-date {
        font-size: 13px;
      }

      @media (max-width: 576px) {
        .calculator-box,
        .history-box {
          padding: 20px;
          border-radius: 16px;
        }

        .history-header {
          align-items: flex-start;
          gap: 10px;
        }

        .history-title {
          font-size: 18px;
        }
      }
    </style>
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->

    <nav
      class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom"
    >
      <div class="container">
        <!-- Logo -->
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="../index.html"
        >
          <div class="logo">
            <i class="bi bi-calculator"></i>
          </div>

          <div>
            <span class="brand-name">Khmer Calculator</span>
            <small class="brand-subtitle">HUB</small>
          </div>
        </a>

        <!-- Mobile Toggle -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item">
              <a class="nav-link" href="../index.html" data-i18n="home">
                Home
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link active"
                href="../index.html#calculators"
                data-i18n="calculators"
              >
                Calculators
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="../index.html#about" data-i18n="about">
                About
              </a>
            </li>

            <li class="nav-item ms-lg-2">
              <button type="button" class="language-btn" id="languageButton">
                <i class="bi bi-translate"></i>
                <span id="languageText">EN</span>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ================= DISCOUNT CALCULATOR ================= -->

    <section class="calculator-page py-5">
      <div class="container">
        <div class="calculator-container">
          <!-- Calculator -->
          <div class="calculator-box">
            <div class="text-center mb-4">
              <h1 data-i18n="discountCalculator">💸 Discount Calculator</h1>

              <p class="text-muted" data-i18n="discountDescription">
                Calculate discount and final price.
              </p>
            </div>

            <!-- Original Price -->
            <div class="mb-3">
              <label class="form-label" data-i18n="originalPrice">
                Original Price
              </label>

              <input
                type="number"
                id="price"
                class="form-control"
                placeholder="Example: 100"
              />
            </div>

            <!-- Discount -->
            <div class="mb-3">
              <label class="form-label" data-i18n="discountPercent">
                Discount (%)
              </label>

              <input
                type="number"
                id="discount"
                class="form-control"
                placeholder="Example: 20"
              />
            </div>

            <!-- Calculate -->
            <button
              onclick="calculateDiscount()"
              class="btn btn-primary w-100"
              type="button"
            >
              <i class="bi bi-calculator"></i>

              <span data-i18n="calculateDiscount"> Calculate Discount </span>
            </button>

            <!-- Result -->
            <div id="discountResult" class="result-box">
              <p data-i18n="youSave">You Save</p>

              <h2 id="saved">$0.00</h2>

              <p data-i18n="finalPrice">Final Price</p>

              <h3 id="finalPrice">$0.00</h3>
            </div>
          </div>

          <!-- ================= HISTORY ================= -->

          <div class="history-box">
            <div class="history-header">
              <h3 class="history-title">
                <i class="bi bi-clock-history"></i>

                <span data-i18n="calculationHistory">
                  Calculation History
                </span>
              </h3>

              <button
                type="button"
                class="btn btn-sm btn-outline-danger"
                onclick="clearDiscountHistory()"
              >
                <i class="bi bi-trash3"></i>

                <span data-i18n="clearHistory"> Clear All </span>
              </button>
            </div>

            <!-- History -->
            <div id="historyContainer"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= SCRIPTS ================= -->

    <!-- History first -->
    <script src="../js/history.js"></script>

    <!-- Discount -->
    <script src="../js/discount.js"></script>

    <!-- Language -->
    <script src="../js/language.js"></script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
