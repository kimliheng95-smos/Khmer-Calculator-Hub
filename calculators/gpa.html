<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GPA Calculator | Khmer Calculator Hub</title>
    <meta
      name="description"
      content="Calculate your GPA quickly and easily with Khmer Calculator Hub. Free GPA calculator for students in Cambodia."
    />

    <meta
      name="keywords"
      content="GPA Calculator, GPA calculator Cambodia, គណនា GPA, Khmer Calculator"
    />

    <meta name="robots" content="index, follow" />
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="canonical"
      href="https://kimliheng95-smos.github.io/Khmer-Calculator-Hub/calculators/gpa.html"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Main CSS -->
    <link rel="stylesheet" href="../css/style.css" />

    <style>
      .calculator-page {
        padding: 70px 0;
        background: #f8fafc;
        min-height: calc(100vh - 76px);
      }

      .calculator-container {
        max-width: 850px;
        margin: auto;
      }

      .calculator-box {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 15px 40px rgba(15, 23, 42, 0.06);
      }

      .calculator-title {
        text-align: center;
        margin-bottom: 30px;
      }

      .calculator-title i {
        font-size: 40px;
        color: #2563eb;
      }

      .calculator-title h1 {
        font-size: 32px;
        font-weight: 800;
        margin-top: 12px;
      }

      .subject-row {
        background: #f8fafc;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 12px;
      }

      .result-box {
        display: none;
        margin-top: 25px;
        padding: 25px;
        background: #eff6ff;
        border-radius: 15px;
        text-align: center;
      }

      .result-box h2 {
        font-size: 48px;
        font-weight: 800;
        color: #2563eb;
      }

      /* ================= HISTORY ================= */

      .history-box {
        margin-top: 25px;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 25px;
        box-shadow: 0 15px 40px rgba(15, 23, 42, 0.06);
      }

      .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .history-title {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        font-size: 20px;
        font-weight: 700;
      }

      .history-title i {
        color: #2563eb;
      }

      .history-item {
        background: #f8fafc;
        transition: 0.2s;
      }

      .history-item:hover {
        transform: translateY(-2px);
      }

      .history-calculator {
        font-weight: 700;
        color: #1e293b;
      }

      .history-result {
        font-size: 16px;
        font-weight: 600;
        color: #2563eb;
      }

      .history-date {
        font-size: 13px;
      }

      @media (max-width: 576px) {
        .calculator-page {
          padding: 40px 0;
        }

        .calculator-box,
        .history-box {
          padding: 20px;
          border-radius: 16px;
        }

        .calculator-title h1 {
          font-size: 27px;
        }

        .history-header {
          align-items: flex-start;
          gap: 10px;
        }

        .history-title {
          font-size: 18px;
        }
      }
    </style>
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->

    <nav
      class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom"
    >
      <div class="container">
        <!-- Logo -->
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="../index.html"
        >
          <div class="logo">
            <i class="bi bi-calculator"></i>
          </div>

          <div>
            <span class="brand-name">Khmer Calculator</span>
            <small class="brand-subtitle">HUB</small>
          </div>
        </a>

        <!-- Mobile Toggle -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavbar"
          aria-controls="mainNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menu -->
        <div class="collapse navbar-collapse" id="mainNavbar">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item">
              <a class="nav-link" href="../index.html" data-i18n="home">
                Home
              </a>
            </li>

            <li class="nav-item">
              <a
                class="nav-link active"
                href="../index.html#calculators"
                data-i18n="calculators"
              >
                Calculators
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="../index.html#about" data-i18n="about">
                About
              </a>
            </li>

            <li class="nav-item ms-lg-2">
              <button type="button" class="language-btn" id="languageButton">
                <i class="bi bi-translate"></i>
                <span id="languageText">EN</span>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ================= GPA CALCULATOR ================= -->

    <section class="calculator-page">
      <div class="container">
        <div class="calculator-container">
          <!-- Title -->
          <div class="calculator-title">
            <i class="bi bi-mortarboard-fill"></i>

            <h1 data-i18n="gpaCalculator">GPA Calculator</h1>

            <p class="text-muted" data-i18n="gpaDescription">
              Calculate your Grade Point Average easily.
            </p>
          </div>

          <!-- ================= CALCULATOR BOX ================= -->

          <div class="calculator-box">
            <div id="subjects">
              <!-- Subject 1 -->
              <div class="subject-row">
                <div class="row g-3 align-items-center">
                  <div class="col-md-5">
                    <input
                      type="text"
                      class="form-control subject-name"
                      placeholder="Subject name"
                      data-i18n-placeholder="subjectName"
                    />
                  </div>

                  <div class="col-md-3">
                    <input
                      type="number"
                      class="form-control subject-credit"
                      placeholder="Credit"
                      data-i18n-placeholder="credit"
                      min="1"
                    />
                  </div>

                  <div class="col-md-4">
                    <select class="form-select subject-grade">
                      <option value="" data-i18n="selectGrade">
                        Select Grade
                      </option>

                      <option value="4">A</option>
                      <option value="3">B</option>
                      <option value="2">C</option>
                      <option value="1">D</option>
                      <option value="0">F</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <!-- Buttons -->
            <div class="d-flex gap-2 flex-wrap">
              <button
                class="btn btn-outline-primary"
                type="button"
                onclick="addSubject()"
              >
                <i class="bi bi-plus-lg"></i>

                <span data-i18n="addSubject"> Add Subject </span>
              </button>

              <button
                class="btn btn-primary"
                type="button"
                onclick="calculateGPA()"
              >
                <i class="bi bi-calculator"></i>

                <span data-i18n="calculateGPA"> Calculate GPA </span>
              </button>
            </div>

            <!-- ================= RESULT ================= -->

            <div class="result-box" id="gpaResult">
              <p class="mb-1" data-i18n="yourGPA">Your GPA</p>

              <h2 id="gpaValue">0.00</h2>

              <strong id="gpaMessage"></strong>
            </div>
          </div>

          <!-- ================= HISTORY ================= -->

          <div class="history-box">
            <div class="history-header">
              <h3 class="history-title">
                <i class="bi bi-clock-history"></i>

                <span data-i18n="calculationHistory">
                  Calculation History
                </span>
              </h3>

              <button
                type="button"
                class="btn btn-sm btn-outline-danger"
                onclick="clearGPAHistory()"
              >
                <i class="bi bi-trash3"></i>

                <span data-i18n="clearHistory"> Clear All </span>
              </button>
            </div>

            <!-- History will appear here -->
            <div id="historyContainer"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= SCRIPTS ================= -->

    <script src="../js/history.js"></script>

    <script src="../js/gpa.js"></script>

    <script src="../js/language.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
