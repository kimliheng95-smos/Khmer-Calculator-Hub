<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard | Khmer Calculator Hub</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
        >
          <img src="images/Logo.png" alt="Logo" width="40" height="40" />

          <div>
            <span class="brand-name">Khmer Calculator</span>
            <small class="brand-subtitle">HUB</small>
          </div>
        </a>

        <div class="d-flex align-items-center gap-2">
          <span class="small text-secondary">
            <i class="bi bi-person-circle"></i>
            <span data-auth-name></span>
          </span>

          <a href="index.html" class="btn btn-light btn-sm"> Home </a>

          <button
            type="button"
            class="btn btn-outline-danger btn-sm"
            onclick="logout()"
          >
            Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- Dashboard -->
    <div class="container py-4">
      <!-- Header -->
      <div
        class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2"
      >
        <div>
          <h1 class="h3 mb-1">Dashboard</h1>

          <p class="text-secondary mb-0">
            សួស្តី, <strong data-auth-name></strong>!
          </p>
        </div>

        <a href="index.html#calculators" class="btn btn-primary btn-sm">
          <i class="bi bi-calculator"></i>
          Calculators
        </a>
      </div>

      <!-- Statistics -->
      <div class="row g-3 mb-4">
        <!-- Total Calculations -->
        <div class="col-md-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-secondary small">Total Calculations</div>

              <div class="fs-3 fw-bold" id="statCount">0</div>
            </div>
          </div>
        </div>

        <!-- Account -->
        <div class="col-md-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-secondary small">Account</div>

              <div class="fw-semibold" data-auth-name></div>

              <div class="small text-secondary" id="userEmail"></div>
            </div>
          </div>
        </div>

        <!-- Quick Links -->
        <div class="col-md-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-secondary small">Quick Links</div>

              <div class="d-flex flex-wrap gap-1 mt-1">
                <a
                  href="calculators/bmi.html"
                  class="btn btn-sm btn-outline-secondary"
                >
                  BMI
                </a>

                <a
                  href="calculators/salary.html"
                  class="btn btn-sm btn-outline-secondary"
                >
                  Salary
                </a>

                <a
                  href="calculators/loan.html"
                  class="btn btn-sm btn-outline-secondary"
                >
                  Loan
                </a>

                <a
                  href="calculators/gpa.html"
                  class="btn btn-sm btn-outline-secondary"
                >
                  GPA
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- History -->
      <div class="card border-0 shadow-sm">
        <div
          class="card-header bg-white d-flex justify-content-between align-items-center"
        >
          <span class="fw-semibold">
            <i class="bi bi-clock-history"></i>
            My Calculation History
          </span>

          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            id="clearAllBtn"
          >
            Clear All
          </button>
        </div>

        <div class="card-body" id="dashboardHistory">
          <p class="text-secondary text-center py-4 mb-0">Loading...</p>
        </div>
      </div>
    </div>

    <!-- JavaScript -->
    <script src="js/auth.js"></script>
    <script src="js/history.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        // =========================
        // Check PHP Session
        // =========================

        const user = await loadSession();

        if (!user) {
          window.location.href = "login.html";
          return;
        }

        // =========================
        // Display User Information
        // =========================

        document.querySelectorAll("[data-auth-name]").forEach(function (el) {
          el.textContent = user.name;
        });

        document.getElementById("userEmail").textContent = user.email;

        // =========================
        // Load History from MySQL
        // =========================

        async function loadDashboardHistory() {
          const container = document.getElementById("dashboardHistory");

          container.innerHTML =
            '<p class="text-secondary text-center py-4 mb-0">Loading...</p>';

          const history = await getAuthHistory();

          document.getElementById("statCount").textContent = history.length;

          // No history
          if (history.length === 0) {
            container.innerHTML =
              '<p class="text-secondary text-center py-4 mb-0">' +
              "No calculation history yet. / មិនទាន់មានប្រវត្តិទេ" +
              "</p>";

            return;
          }

          const lang = localStorage.getItem("language") || "en";

          // Display history
          container.innerHTML = history
            .map(function (item) {
              const name =
                typeof getCalculatorDisplayName === "function"
                  ? getCalculatorDisplayName(item, lang)
                  : item.calculator_name ||
                    item.calculator ||
                    item.calculatorType ||
                    "Calculator";

              const result =
                typeof formatHistoryResult === "function"
                  ? formatHistoryResult(item)
                  : item.result_text || item.result || "";

              const date = item.date || item.created_at || "";

              return (
                '<div class="history-item border rounded p-3 mb-2">' +
                '<div class="d-flex justify-content-between align-items-start gap-3">' +
                "<div>" +
                '<div class="history-calculator fw-semibold">' +
                name +
                "</div>" +
                '<div class="history-result mt-1 small">' +
                result +
                "</div>" +
                '<small class="text-secondary">' +
                date +
                "</small>" +
                "</div>" +
                "<button " +
                'type="button" ' +
                'class="btn btn-sm btn-outline-danger" ' +
                'data-id="' +
                item.id +
                '">' +
                '<i class="bi bi-trash"></i>' +
                "</button>" +
                "</div>" +
                "</div>"
              );
            })
            .join("");

          // =========================
          // Delete One History
          // =========================

          container.querySelectorAll("button[data-id]").forEach(function (btn) {
            btn.addEventListener("click", async function () {
              const id = Number(btn.getAttribute("data-id"));

              const result = await deleteAuthHistoryItem(id);

              if (result.success) {
                loadDashboardHistory();
              } else {
                alert("Cannot delete history / មិនអាចលុបប្រវត្តិបានទេ");
              }
            });
          });
        }

        // =========================
        // Clear All History
        // =========================

        document
          .getElementById("clearAllBtn")
          .addEventListener("click", async function () {
            if (!confirm("Clear all history? / លុបប្រវត្តិទាំងអស់?")) {
              return;
            }

            const result = await clearAuthHistory();

            if (result.success) {
              loadDashboardHistory();
            } else {
              alert("Cannot clear history / មិនអាចលុបប្រវត្តិបានទេ");
            }
          });

        // =========================
        // Initial Load
        // =========================

        loadDashboardHistory();
      });
    </script>
  </body>
</html>
