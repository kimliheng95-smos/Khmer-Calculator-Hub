<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard | Khmer Calculator Hub</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css" />
      <!-- Professional theme + animations -->
    <link rel="stylesheet" href="css/theme.css" />
  </head>

  <body>
    <!-- ================================================= -->
    <!-- ===================== NAVBAR ==================== -->
    <!-- ================================================= -->

    <nav
      class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom"
    >
      <div class="container">
        <!-- Logo -->

        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
        >
          <img src="images/Logo.png" alt="Logo" width="40" height="40" />

          <div>
            <span class="brand-name"> Khmer Calculator </span>

            <small class="brand-subtitle"> HUB </small>
          </div>
        </a>

        <!-- Right Navigation -->

        <div class="d-flex align-items-center gap-2">
          <!-- User -->

          <span class="small text-secondary">
            <i class="bi bi-person-circle"></i>

            <span data-auth-name></span>
          </span>

          <!-- Home -->

          <a href="index.html" class="btn btn-light btn-sm" data-i18n="home">
            Home
          </a>

          <!-- Language -->

          <button
            type="button"
            class="language-btn"
            id="languageButton"
            aria-label="Switch language"
          >
            <i class="bi bi-translate"></i>
            <span id="languageText">EN</span>
          </button>

          <!-- Logout -->

          <button
            type="button"
            class="btn btn-outline-danger btn-sm"
            id="logoutBtn"
            data-i18n="logout"
          >
            Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- ================================================= -->
    <!-- ===================== DASHBOARD ================= -->
    <!-- ================================================= -->

    <div class="container py-4">
      <!-- Header -->

      <div
        class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2"
      >
        <div>
          <h1 class="h3 mb-1" data-i18n="dashboard">Dashboard</h1>

          <p class="text-secondary mb-0">
            <span data-i18n="hello"> Hello, </span>

            <strong data-auth-name></strong>!
          </p>
        </div>

        <!-- Calculators Button -->

        <a href="index.html#calculators" class="btn btn-primary btn-sm">
          <i class="bi bi-calculator"></i>

          <span data-i18n="calculators"> Calculators </span>
        </a>
      </div>

      <!-- ================================================= -->
      <!-- ==================== STATISTICS ================= -->
      <!-- ================================================= -->

      <div class="row g-3 mb-4">
        <!-- Total Calculations -->

        <div class="col-md-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-secondary small" data-i18n="totalCalculations">
                Total Calculations
              </div>

              <div class="fs-3 fw-bold" id="statCount">0</div>
            </div>
          </div>
        </div>

        <!-- Account -->

        <div class="col-md-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-secondary small" data-i18n="account">
                Account
              </div>

              <div class="fw-semibold" data-auth-name></div>

              <div class="small text-secondary" id="userEmail"></div>
            </div>
          </div>
        </div>

        <!-- Quick Links -->

        <div class="col-md-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-secondary small" data-i18n="quickLinks">
                Quick Links
              </div>

              <div class="d-flex flex-wrap gap-1 mt-1">
                <a
                  href="calculators/bmi.html"
                  class="btn btn-sm btn-outline-secondary"
                  data-i18n="bmi"
                >
                  BMI
                </a>

                <a
                  href="calculators/salary.html"
                  class="btn btn-sm btn-outline-secondary"
                  data-i18n="salary"
                >
                  Salary
                </a>

                <a
                  href="calculators/loan.html"
                  class="btn btn-sm btn-outline-secondary"
                  data-i18n="loan"
                >
                  Loan
                </a>

                <a
                  href="calculators/gpa.html"
                  class="btn btn-sm btn-outline-secondary"
                  data-i18n="gpa"
                >
                  GPA
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ================================================= -->
      <!-- ====================== HISTORY ================== -->
      <!-- ================================================= -->

      <div class="card border-0 shadow-sm">
        <!-- History Header -->

        <div
          class="card-header bg-white d-flex justify-content-between align-items-center"
        >
          <span class="fw-semibold">
            <i class="bi bi-clock-history"></i>

            <span data-i18n="myCalculationHistory">
              My Calculation History
            </span>
          </span>

          <!-- Clear All -->

          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            id="clearAllBtn"
            data-i18n="clearAll"
          >
            Clear All
          </button>
        </div>

        <!-- History Content -->

        <div class="card-body" id="dashboardHistory">
          <p class="text-secondary text-center py-4 mb-0" data-i18n="loading">
            Loading...
          </p>
        </div>
      </div>
    </div>

    <!-- ================================================= -->
    <!-- ===================== JAVASCRIPT ================ -->
    <!-- ================================================= -->

    <script type="module">
      import {
        loadSession,
        logout,
        getAuthHistory,
        deleteAuthHistoryItem,
        clearAuthHistory,
      } from "./js/auth.js";

      import {
        getCalculatorDisplayName,
        formatHistoryResult,
        getHistory,
        deleteHistory,
        clearHistory,
      } from "./js/history.js";

      import { getCurrentLanguage } from "./js/language.js";

      function isKhmer() {
        return getCurrentLanguage() === "kh";
      }

      function t(en, kh) {
        return isKhmer() ? kh : en;
      }

      document.addEventListener("DOMContentLoaded", async function () {
        const user = await loadSession();

        if (!user) {
          window.location.href = "login.html";
          return;
        }

        document.querySelectorAll("[data-auth-name]").forEach(function (el) {
          el.textContent = user.name || user.email || "User";
        });

        const emailEl = document.getElementById("userEmail");
        if (emailEl) emailEl.textContent = user.email || "";

        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", async function () {
            const result = await logout();
            if (result && result.success) {
              window.location.href = "login.html";
            } else {
              alert(t("Logout failed.", "ចាកចេញមិនបានទេ។"));
            }
          });
        }

        async function loadDashboardHistory() {
          const container = document.getElementById("dashboardHistory");
          if (!container) return;

          container.innerHTML =
            '<p class="text-secondary text-center py-4 mb-0">' +
            t("Loading...", "កំពុងផ្ទុក...") +
            "</p>";

          try {
            // Prefer Firestore; getHistory falls back to local if remote empty
            let history = await getAuthHistory();

            if (!Array.isArray(history) || history.length === 0) {
              // Fallback: localStorage (so user still sees something)
              history = await getHistory();
            }

            const countEl = document.getElementById("statCount");
            if (countEl) countEl.textContent = String(history.length || 0);

            if (!history || history.length === 0) {
              container.innerHTML =
                '<p class="text-secondary text-center py-4 mb-0">' +
                t(
                  "No calculation history yet. Use a calculator while logged in.",
                  "មិនទាន់មានប្រវត្តិទេ។ សូមគណនាខណៈពេលបាន login។",
                ) +
                "</p>";
              return;
            }

            const lang = getCurrentLanguage();

            container.innerHTML = history
              .map(function (item) {
                const name = getCalculatorDisplayName(item, lang);
                const result = formatHistoryResult(item);

                let date = "";
                if (
                  item.createdAt &&
                  typeof item.createdAt.toDate === "function"
                ) {
                  date = item.createdAt
                    .toDate()
                    .toLocaleString(lang === "kh" ? "km-KH" : "en-US");
                } else if (item.createdAt) {
                  try {
                    date = new Date(item.createdAt).toLocaleString(
                      lang === "kh" ? "km-KH" : "en-US",
                    );
                  } catch (e) {
                    date = "";
                  }
                } else if (item.date) {
                  date = item.date;
                }

                return (
                  '<div class="history-item border rounded p-3 mb-2">' +
                  '<div class="d-flex justify-content-between align-items-start gap-3">' +
                  "<div>" +
                  '<div class="history-calculator fw-semibold">' +
                  name +
                  "</div>" +
                  '<div class="history-result mt-1 small">' +
                  result +
                  "</div>" +
                  '<small class="text-secondary">' +
                  date +
                  "</small>" +
                  "</div>" +
                  '<button type="button" class="btn btn-sm btn-outline-danger" data-id="' +
                  String(item.id) +
                  '" title="' +
                  t("Delete", "លុប") +
                  '"><i class="bi bi-trash"></i></button>' +
                  "</div></div>"
                );
              })
              .join("");

            container
              .querySelectorAll("button[data-id]")
              .forEach(function (btn) {
                btn.addEventListener("click", async function () {
                  const id = btn.getAttribute("data-id");
                  // deleteHistory handles local + Firestore
                  const result = await deleteHistory(id);
                  if (result && result.success) {
                    await loadDashboardHistory();
                  } else {
                    // try direct firestore delete as fallback
                    const r2 = await deleteAuthHistoryItem(id);
                    if (r2 && r2.success) {
                      await loadDashboardHistory();
                    } else {
                      alert(
                        t("Cannot delete history.", "មិនអាចលុបប្រវត្តិបានទេ។"),
                      );
                      console.error("delete failed", result, r2);
                    }
                  }
                });
              });
          } catch (error) {
            console.error("Dashboard history error:", error);
            container.innerHTML =
              '<p class="text-danger text-center py-4 mb-0">' +
              t("Cannot load history.", "មិនអាចទាញយកប្រវត្តិបានទេ។") +
              "<br><small>" +
              (error && error.message ? error.message : "") +
              "</small></p>";
          }
        }

        const clearAllBtn = document.getElementById("clearAllBtn");
        if (clearAllBtn) {
          clearAllBtn.addEventListener("click", async function () {
            const confirmed = confirm(
              t("Clear all history?", "តើអ្នកចង់លុបប្រវត្តិទាំងអស់មែនទេ?"),
            );
            if (!confirmed) return;

            const result = await clearHistory();
            // also clear firestore
            await clearAuthHistory();

            if (result && result.success) {
              await loadDashboardHistory();
            } else {
              await loadDashboardHistory();
            }
          });
        }

        await loadDashboardHistory();
      });
    </script>

    <!-- ================================================= -->
    <!-- ================= GLOBAL LANGUAGE =============== -->
    <!-- ================================================= -->

    <script type="module" src="js/language.js"></script>
      <!-- UI effects -->
    <script type="module" src="js/ui-effects.js"></script>
  </body>
</html>
