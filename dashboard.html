<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard | Khmer Calculator Hub</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
        >
          <img src="images/Logo.png" alt="Logo" width="40" height="40" />

          <div>
            <span class="brand-name">Khmer Calculator</span>
            <small class="brand-subtitle">HUB</small>
          </div>
        </a>

        <div class="d-flex align-items-center gap-2">
          <span class="small text-secondary">
            <i class="bi bi-person-circle"></i>
            <span data-auth-name></span>
          </span>

          <a href="index.html" class="btn btn-light btn-sm"> Home </a>

          <button
            type="button"
            class="btn btn-outline-danger btn-sm"
            id="logoutBtn"
          >
            Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- Dashboard -->
    <div class="container py-4">
      <!-- Header -->
      <div
        class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2"
      >
        <div>
          <h1 class="h3 mb-1">Dashboard</h1>

          <p class="text-secondary mb-0">
            សួស្តី,
            <strong data-auth-name></strong>!
          </p>
        </div>

        <a href="index.html#calculators" class="btn btn-primary btn-sm">
          <i class="bi bi-calculator"></i>
          Calculators
        </a>
      </div>

      <!-- Statistics -->
      <div class="row g-3 mb-4">
        <!-- Total Calculations -->
        <div class="col-md-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-secondary small">Total Calculations</div>

              <div class="fs-3 fw-bold" id="statCount">0</div>
            </div>
          </div>
        </div>

        <!-- Account -->
        <div class="col-md-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-secondary small">Account</div>

              <div class="fw-semibold" data-auth-name></div>

              <div class="small text-secondary" id="userEmail"></div>
            </div>
          </div>
        </div>

        <!-- Quick Links -->
        <div class="col-md-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-secondary small">Quick Links</div>

              <div class="d-flex flex-wrap gap-1 mt-1">
                <a
                  href="calculators/bmi.html"
                  class="btn btn-sm btn-outline-secondary"
                >
                  BMI
                </a>

                <a
                  href="calculators/salary.html"
                  class="btn btn-sm btn-outline-secondary"
                >
                  Salary
                </a>

                <a
                  href="calculators/loan.html"
                  class="btn btn-sm btn-outline-secondary"
                >
                  Loan
                </a>

                <a
                  href="calculators/gpa.html"
                  class="btn btn-sm btn-outline-secondary"
                >
                  GPA
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- History -->
      <div class="card border-0 shadow-sm">
        <div
          class="card-header bg-white d-flex justify-content-between align-items-center"
        >
          <span class="fw-semibold">
            <i class="bi bi-clock-history"></i>

            My Calculation History
          </span>

          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            id="clearAllBtn"
          >
            Clear All
          </button>
        </div>

        <div class="card-body" id="dashboardHistory">
          <p class="text-secondary text-center py-4 mb-0">Loading...</p>
        </div>
      </div>
    </div>

    <!-- ========================================
         MODULAR JAVASCRIPT
         ======================================== -->

    <script type="module">
      import {
        loadSession,
        logout,
        getAuthHistory,
        deleteAuthHistoryItem,
        clearAuthHistory,
      } from "./js/auth.js";

      import {
        getCalculatorDisplayName,
        formatHistoryResult,
      } from "./js/history.js";

      // ========================================
      // DOM READY
      // ========================================

      document.addEventListener("DOMContentLoaded", async function () {
        // ========================================
        // CHECK LOGIN
        // ========================================

        const user = await loadSession();

        if (!user) {
          window.location.href = "login.html";

          return;
        }

        // ========================================
        // DISPLAY USER INFORMATION
        // ========================================

        document.querySelectorAll("[data-auth-name]").forEach(function (el) {
          el.textContent = user.name || "User";
        });

        document.getElementById("userEmail").textContent = user.email || "";

        // ========================================
        // LOGOUT
        // ========================================

        document
          .getElementById("logoutBtn")
          .addEventListener("click", async function () {
            const result = await logout();

            if (result.success) {
              window.location.href = "login.html";
            } else {
              alert("Logout failed / ចាកចេញមិនបានទេ");
            }
          });

        // ========================================
        // LOAD DASHBOARD HISTORY
        // ========================================

        async function loadDashboardHistory() {
          const container = document.getElementById("dashboardHistory");

          container.innerHTML = `
              <p class="text-secondary text-center py-4 mb-0">
                Loading...
              </p>
            `;

          try {
            const history = await getAuthHistory();

            // ========================================
            // TOTAL COUNT
            // ========================================

            document.getElementById("statCount").textContent = history.length;

            // ========================================
            // NO HISTORY
            // ========================================

            if (!history || history.length === 0) {
              container.innerHTML = `
                  <p class="text-secondary text-center py-4 mb-0">
                    No calculation history yet. /
                    មិនទាន់មានប្រវត្តិទេ
                  </p>
                `;

              return;
            }

            // ========================================
            // LANGUAGE
            // ========================================

            const lang = localStorage.getItem("language") || "en";

            // ========================================
            // DISPLAY HISTORY
            // ========================================

            container.innerHTML = history
              .map(function (item) {
                const name = getCalculatorDisplayName(item, lang);

                const result = formatHistoryResult(item);

                // Firestore Timestamp
                let date = "";

                if (
                  item.createdAt &&
                  typeof item.createdAt.toDate === "function"
                ) {
                  date = item.createdAt.toDate().toLocaleString();
                } else if (item.date) {
                  date = item.date;
                } else if (item.created_at) {
                  date = item.created_at;
                }

                return `

                    <div
                      class="history-item border rounded p-3 mb-2"
                    >

                      <div
                        class="d-flex justify-content-between align-items-start gap-3"
                      >

                        <div>

                          <div
                            class="history-calculator fw-semibold"
                          >
                            ${name}
                          </div>


                          <div
                            class="history-result mt-1 small"
                          >
                            ${result}
                          </div>


                          <small
                            class="text-secondary"
                          >
                            ${date}
                          </small>

                        </div>


                        <button
                          type="button"
                          class="btn btn-sm btn-outline-danger"
                          data-id="${String(item.id)}"
                        >

                          <i class="bi bi-trash"></i>

                        </button>

                      </div>

                    </div>

                  `;
              })
              .join("");

            // ========================================
            // DELETE ONE HISTORY
            // ========================================

            container
              .querySelectorAll("button[data-id]")
              .forEach(function (btn) {
                btn.addEventListener("click", async function () {
                  const id = btn.getAttribute("data-id");

                  // IMPORTANT:
                  // Do NOT use Number(id)
                  // Firestore document IDs are strings.

                  const result = await deleteAuthHistoryItem(id);

                  if (result && result.success) {
                    await loadDashboardHistory();
                  } else {
                    alert("Cannot delete history / មិនអាចលុបប្រវត្តិបានទេ");
                  }
                });
              });
          } catch (error) {
            console.error("Dashboard history error:", error);

            container.innerHTML = `
                <p class="text-danger text-center py-4 mb-0">
                  Cannot load history /
                  មិនអាចទាញយកប្រវត្តិបានទេ
                </p>
              `;
          }
        }

        // ========================================
        // CLEAR ALL HISTORY
        // ========================================

        document
          .getElementById("clearAllBtn")
          .addEventListener("click", async function () {
            const confirmed = confirm(
              "Clear all history? / លុបប្រវត្តិទាំងអស់?",
            );

            if (!confirmed) {
              return;
            }

            const result = await clearAuthHistory();

            if (result && result.success) {
              await loadDashboardHistory();
            } else {
              alert("Cannot clear history / មិនអាចលុបប្រវត្តិបានទេ");
            }
          });

        // ========================================
        // INITIAL LOAD
        // ========================================

        await loadDashboardHistory();
      });
    </script>
  </body>
</html>
