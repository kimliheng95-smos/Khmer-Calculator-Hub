<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard | Khmer Calculator Hub</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Main CSS -->
    <script type="module" crossorigin src="/Khmer-Calculator-Hub/assets/dashboard-DPum_hwI.js"></script>
    <link rel="modulepreload" crossorigin href="/Khmer-Calculator-Hub/assets/auth-BFR1T5uo.js">
    <link rel="modulepreload" crossorigin href="/Khmer-Calculator-Hub/assets/history-KNf5dX_c.js">
    <link rel="stylesheet" crossorigin href="/Khmer-Calculator-Hub/assets/style-DvKrXJkU.css">
  </head>

  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
        >
          <img src="/Khmer-Calculator-Hub/assets/Logo-C6ku9GlI.png" alt="Logo" width="40" height="40" />

          <div>
            <span class="brand-name">Khmer Calculator</span>
            <small class="brand-subtitle">HUB</small>
          </div>
        </a>

        <div class="d-flex align-items-center gap-2">
          <span class="small text-secondary">
            <i class="bi bi-person-circle"></i>
            <span data-auth-name></span>
          </span>

          <a href="index.html" class="btn btn-light btn-sm"> Home </a>

          <button
            type="button"
            class="btn btn-outline-danger btn-sm"
            id="logoutBtn"
          >
            Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- Dashboard -->
    <div class="container py-4">
      <!-- Header -->
      <div
        class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2"
      >
        <div>
          <h1 class="h3 mb-1">Dashboard</h1>

          <p class="text-secondary mb-0">
            សួស្តី,
            <strong data-auth-name></strong>!
          </p>
        </div>

        <a href="index.html#calculators" class="btn btn-primary btn-sm">
          <i class="bi bi-calculator"></i>
          Calculators
        </a>
      </div>

      <!-- Statistics -->
      <div class="row g-3 mb-4">
        <!-- Total Calculations -->
        <div class="col-md-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-secondary small">Total Calculations</div>

              <div class="fs-3 fw-bold" id="statCount">0</div>
            </div>
          </div>
        </div>

        <!-- Account -->
        <div class="col-md-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-secondary small">Account</div>

              <div class="fw-semibold" data-auth-name></div>

              <div class="small text-secondary" id="userEmail"></div>
            </div>
          </div>
        </div>

        <!-- Quick Links -->
        <div class="col-md-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <div class="text-secondary small">Quick Links</div>

              <div class="d-flex flex-wrap gap-1 mt-1">
                <a
                  href="calculators/bmi.html"
                  class="btn btn-sm btn-outline-secondary"
                >
                  BMI
                </a>

                <a
                  href="calculators/salary.html"
                  class="btn btn-sm btn-outline-secondary"
                >
                  Salary
                </a>

                <a
                  href="calculators/loan.html"
                  class="btn btn-sm btn-outline-secondary"
                >
                  Loan
                </a>

                <a
                  href="calculators/gpa.html"
                  class="btn btn-sm btn-outline-secondary"
                >
                  GPA
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- History -->
      <div class="card border-0 shadow-sm">
        <div
          class="card-header bg-white d-flex justify-content-between align-items-center"
        >
          <span class="fw-semibold">
            <i class="bi bi-clock-history"></i>

            My Calculation History
          </span>

          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            id="clearAllBtn"
          >
            Clear All
          </button>
        </div>

        <div class="card-body" id="dashboardHistory">
          <p class="text-secondary text-center py-4 mb-0">Loading...</p>
        </div>
      </div>
    </div>

    <!-- ========================================
         MODULAR JAVASCRIPT
         ======================================== -->

  </body>
</html>
