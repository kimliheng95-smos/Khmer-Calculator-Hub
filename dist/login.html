<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Khmer Calculator Hub</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="module" crossorigin src="/Khmer-Calculator-Hub/assets/login-Cp_2NCOT.js"></script>
    <link rel="modulepreload" crossorigin href="/Khmer-Calculator-Hub/assets/language-BCbXHEiN.js">
    <link rel="modulepreload" crossorigin href="/Khmer-Calculator-Hub/assets/auth-CTlX_AaI.js">
    <link rel="stylesheet" crossorigin href="/Khmer-Calculator-Hub/assets/language-DvKrXJkU.css">
  </head>

  <body>
    <!-- ================================================= -->
    <!-- ===================== NAVBAR ==================== -->
    <!-- ================================================= -->

    <nav
      class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
        >
          <img src="/Khmer-Calculator-Hub/assets/Logo-C6ku9GlI.png" alt="Logo" width="40" height="40" />

          <div>
            <span class="brand-name">Khmer Calculator</span>
            <small class="brand-subtitle">HUB</small>
          </div>
        </a>

        <div class="d-flex gap-2 align-items-center">
          <!-- Register -->

          <a
            href="register.html"
            class="btn btn-primary btn-sm"
            data-i18n="register"
          >
            Register
          </a>

          <!-- Home -->

          <a href="index.html" class="btn btn-light btn-sm" data-i18n="home">
            Home
          </a>

          <!-- Language -->

          <button
            type="button"
            class="language-btn"
            id="languageButton"
            aria-label="Switch language"
          >
            <i class="bi bi-translate"></i>

            <span id="languageText">EN</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- ================================================= -->
    <!-- ====================== LOGIN ==================== -->
    <!-- ================================================= -->

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <h2 class="h4 mb-1 text-center" data-i18n="login">Login</h2>

              <p
                class="text-secondary text-center small mb-4"
                data-i18n="loginDescription"
              >
                ចូលគណនី
              </p>

              <!-- Alert -->

              <div id="authAlert" class="alert d-none" role="alert"></div>

              <!-- Login Form -->

              <form id="loginForm">
                <!-- Email -->

                <div class="mb-3">
                  <label class="form-label" for="email" data-i18n="email">
                    Email
                  </label>

                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    required
                    placeholder="you@email.com"
                    data-i18n-placeholder="emailPlaceholder"
                  />
                </div>

                <!-- Password -->

                <div class="mb-3">
                  <label class="form-label" for="password" data-i18n="password">
                    Password
                  </label>

                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    required
                    data-i18n-placeholder="passwordPlaceholder"
                  />
                </div>

                <!-- Login Button -->

                <button
                  type="submit"
                  class="btn btn-primary w-100"
                  data-i18n="login"
                >
                  Login
                </button>
              </form>

              <p class="text-center mt-3 mb-0 small">
                <span data-i18n="noAccount"> No account? </span>

                <a href="register.html" data-i18n="register"> Register </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================================================= -->
    <!-- ===================== JAVASCRIPT =============== -->
    <!-- ================================================= -->

    <!-- Firebase Authentication -->


    <!-- Global Language -->


  </body>
</html>
