<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register | Khmer Calculator Hub</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Main CSS -->
    <script type="module" crossorigin src="/Khmer-Calculator-Hub/assets/register-uXmuPAiv.js"></script>
    <link rel="modulepreload" crossorigin href="/Khmer-Calculator-Hub/assets/auth-D9KPvz_S.js">
    <link rel="stylesheet" crossorigin href="/Khmer-Calculator-Hub/assets/auth-DvKrXJkU.css">
  </head>

  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
        >
          <img src="/Khmer-Calculator-Hub/assets/Logo-C6ku9GlI.png" alt="Logo" width="40" height="40" />

          <div>
            <span class="brand-name"> Khmer Calculator </span>

            <small class="brand-subtitle"> HUB </small>
          </div>
        </a>

        <div class="d-flex gap-2">
          <a href="login.html" class="btn btn-outline-primary btn-sm">
            Login
          </a>

          <a href="index.html" class="btn btn-light btn-sm"> Home </a>
        </div>
      </div>
    </nav>

    <!-- Register -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <h2 class="h4 mb-1 text-center">Register</h2>

              <p class="text-secondary text-center small mb-4">
                ចុះឈ្មោះគណនីថ្មី
              </p>

              <!-- Alert -->
              <div id="authAlert" class="alert d-none" role="alert"></div>

              <!-- Register Form -->
              <form id="registerForm">
                <!-- Name -->
                <div class="mb-3">
                  <label class="form-label" for="name"> Name / ឈ្មោះ </label>

                  <input
                    type="text"
                    class="form-control"
                    id="name"
                    required
                    minlength="2"
                    placeholder="Your name"
                  />
                </div>

                <!-- Email -->
                <div class="mb-3">
                  <label class="form-label" for="email"> Email </label>

                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    required
                    placeholder="you@email.com"
                  />
                </div>

                <!-- Password -->
                <div class="mb-3">
                  <label class="form-label" for="password"> Password </label>

                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    required
                    minlength="6"
                    placeholder="Min 6 characters"
                  />
                </div>

                <!-- Confirm Password -->
                <div class="mb-3">
                  <label class="form-label" for="confirm">
                    Confirm Password
                  </label>

                  <input
                    type="password"
                    class="form-control"
                    id="confirm"
                    required
                    minlength="6"
                    placeholder="Confirm your password"
                  />
                </div>

                <!-- Register Button -->
                <button type="submit" class="btn btn-primary w-100">
                  Register / ចុះឈ្មោះ
                </button>
              </form>

              <!-- Login Link -->
              <p class="text-center mt-3 mb-0 small">
                Already have an account?

                <a href="login.html"> Login </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Register JavaScript -->
  </body>
</html>
