<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register | Khmer Calculator Hub</title>

    <!-- Bootstrap -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Main CSS -->

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- ================================================= -->
    <!-- ===================== NAVBAR ==================== -->
    <!-- ================================================= -->

    <nav
      class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom"
    >
      <div class="container">
        <!-- Logo -->

        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
        >
          <img src="images/Logo.png" alt="Logo" width="40" height="40" />

          <div>
            <span class="brand-name"> Khmer Calculator </span>

            <small class="brand-subtitle"> HUB </small>
          </div>
        </a>

        <!-- Navigation -->

        <div class="d-flex gap-2 align-items-center">
          <!-- Login -->

          <a
            href="login.html"
            class="btn btn-outline-primary btn-sm"
            data-i18n="login"
          >
            Login
          </a>

          <!-- Home -->

          <a href="index.html" class="btn btn-light btn-sm" data-i18n="home">
            Home
          </a>

          <!-- Language -->

          <button
            type="button"
            class="language-btn"
            id="languageButton"
            aria-label="Switch language"
          >
            <i class="bi bi-translate"></i>

            <span id="languageText">EN</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- ================================================= -->
    <!-- ===================== REGISTER ================== -->
    <!-- ================================================= -->

    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <h2 class="h4 mb-1 text-center" data-i18n="register">Register</h2>

              <p
                class="text-secondary text-center small mb-4"
                data-i18n="registerDescription"
              >
                Create a new account
              </p>

              <!-- Alert -->

              <div id="authAlert" class="alert d-none" role="alert"></div>

              <!-- Register Form -->

              <form id="registerForm">
                <!-- Name -->

                <div class="mb-3">
                  <label class="form-label" for="name" data-i18n="name">
                    Name
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="name"
                    required
                    minlength="2"
                    placeholder="Your name"
                    data-i18n-placeholder="namePlaceholder"
                  />
                </div>

                <!-- Email -->

                <div class="mb-3">
                  <label class="form-label" for="email" data-i18n="email">
                    Email
                  </label>

                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    required
                    placeholder="you@email.com"
                    data-i18n-placeholder="emailPlaceholder"
                  />
                </div>

                <!-- Password -->

                <div class="mb-3">
                  <label class="form-label" for="password" data-i18n="password">
                    Password
                  </label>

                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    required
                    minlength="6"
                    placeholder="Min 6 characters"
                    data-i18n-placeholder="passwordPlaceholder"
                  />
                </div>

                <!-- Confirm Password -->

                <div class="mb-3">
                  <label
                    class="form-label"
                    for="confirm"
                    data-i18n="confirmPassword"
                  >
                    Confirm Password
                  </label>

                  <input
                    type="password"
                    class="form-control"
                    id="confirm"
                    required
                    minlength="6"
                    placeholder="Confirm your password"
                    data-i18n-placeholder="confirmPasswordPlaceholder"
                  />
                </div>

                <!-- Register Button -->

                <button
                  type="submit"
                  class="btn btn-primary w-100"
                  data-i18n="register"
                >
                  Register
                </button>
              </form>

              <!-- Login Link -->

              <p class="text-center mt-3 mb-0 small">
                <span data-i18n="alreadyAccount">
                  Already have an account?
                </span>

                <a href="login.html" data-i18n="login"> Login </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================================================= -->
    <!-- ===================== REGISTER JS =============== -->
    <!-- ================================================= -->

    <script type="module">
      import { loadSession, register } from "./js/auth.js";

      import { getCurrentLanguage } from "./js/language.js";

      const form = document.getElementById("registerForm");

      const alertBox = document.getElementById("authAlert");

      // ========================================
      // SHOW MESSAGE
      // ========================================

      function showAlert(message, type = "danger") {
        alertBox.style.display = "block";

        alertBox.className = `alert alert-${type}`;

        alertBox.textContent = message;
      }

      // ========================================
      // GET CURRENT LANGUAGE
      // ========================================

      function isKhmer() {
        return getCurrentLanguage() === "kh";
      }

      // ========================================
      // CHECK EXISTING LOGIN
      // ========================================

      const user = await loadSession();

      if (user) {
        window.location.href = "index.html";
      }

      // ========================================
      // REGISTER
      // ========================================

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const name = document.getElementById("name").value;

        const email = document.getElementById("email").value;

        const password = document.getElementById("password").value;

        const confirm = document.getElementById("confirm").value;

        // ========================================
        // EMPTY CHECK
        // ========================================

        if (!name.trim() || !email.trim() || !password || !confirm) {
          showAlert(
            isKhmer()
              ? "សូមបំពេញព័ត៌មានទាំងអស់។"
              : "Please fill in all fields.",
          );

          return;
        }

        // ========================================
        // CONFIRM PASSWORD
        // ========================================

        if (password !== confirm) {
          showAlert(
            isKhmer() ? "ពាក្យសម្ងាត់មិនដូចគ្នាទេ។" : "Passwords do not match.",
          );

          return;
        }

        // ========================================
        // REGISTER
        // ========================================

        const result = await register(name, email, password);

        if (result.success) {
          showAlert(
            isKhmer() ? "ចុះឈ្មោះបានជោគជ័យ!" : "Registration successful!",
            "success",
          );

          setTimeout(function () {
            window.location.href = "index.html";
          }, 800);
        } else {
          showAlert(
            result.message ||
              (isKhmer() ? "ការចុះឈ្មោះបរាជ័យ។" : "Registration failed."),
          );
        }
      });
    </script>

    <!-- ================================================= -->
    <!-- ================= GLOBAL LANGUAGE =============== -->
    <!-- ================================================= -->

    <script type="module" src="js/language.js"></script>
  </body>
</html>
