<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Khmer Calculator Hub</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
        >
          <img src="images/Logo.png" alt="Logo" width="40" height="40" />

          <div>
            <span class="brand-name">Khmer Calculator</span>
            <small class="brand-subtitle">HUB</small>
          </div>
        </a>

        <div class="d-flex gap-2">
          <a href="register.html" class="btn btn-primary btn-sm"> Register </a>

          <a href="index.html" class="btn btn-light btn-sm"> Home </a>
        </div>
      </div>
    </nav>

    <!-- Login -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <h2 class="h4 mb-1 text-center">Login</h2>

              <p class="text-secondary text-center small mb-4">ចូលគណនី</p>

              <div id="authAlert" class="alert d-none" role="alert"></div>

              <form id="loginForm">
                <!-- Email -->
                <div class="mb-3">
                  <label class="form-label" for="email"> Email </label>

                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    required
                    placeholder="you@email.com"
                  />
                </div>

                <!-- Password -->
                <div class="mb-3">
                  <label class="form-label" for="password"> Password </label>

                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    required
                  />
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn btn-primary w-100">
                  Login / ចូល
                </button>
              </form>

              <p class="text-center mt-3 mb-0 small">
                No account?
                <a href="register.html">Register</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const user = await loadSession();
        if (user) {
          window.location.href = "dashboard.html";
          return;
        }

        document
          .getElementById("loginForm")
          .addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const alertEl = document.getElementById("authAlert");

            const result = await login(email, password);

            if (!result.success) {
              const messages = {
                empty: "Please enter email and password / សូមបញ្ចូលអ៊ីមែល និងពាក្យសម្ងាត់",
                invalid: "Email or password incorrect / អ៊ីមែល ឬ ពាក្យសម្ងាត់មិនត្រឹមត្រូវ",
                too_many: "Too many attempts. Try later / ព្យាយាមច្រើនពេក សូមរង់ចាំ",
                network_error: "Cannot connect / មិនអាចភ្ជាប់បានទេ",
                server_error: "Server error. Please try again / មានបញ្ហា សូមព្យាយាមម្តងទៀត",
              };

              alertEl.className = "alert alert-danger";
              alertEl.textContent = messages[result.error] || "Login failed / ចូលគណនីមិនបាន";
              alertEl.classList.remove("d-none");
              return;
            }

            window.location.href = "dashboard.html";
          });
      });
    </script>
  </body>
</html>
