<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login | Khmer Calculator Hub</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kantumruy+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-light bg-white sticky-top border-bottom"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="index.html"
        >
          <img src="images/Logo.png" alt="Logo" width="40" height="40" />

          <div>
            <span class="brand-name">Khmer Calculator</span>
            <small class="brand-subtitle">HUB</small>
          </div>
        </a>

        <div class="d-flex gap-2">
          <a href="register.html" class="btn btn-primary btn-sm"> Register </a>

          <a href="index.html" class="btn btn-light btn-sm"> Home </a>
        </div>
      </div>
    </nav>

    <!-- Login -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm border-0">
            <div class="card-body p-4">
              <h2 class="h4 mb-1 text-center">Login</h2>

              <p class="text-secondary text-center small mb-4">ចូលគណនី</p>

              <!-- Alert -->
              <div id="authAlert" class="alert d-none" role="alert"></div>

              <!-- Login Form -->
              <form id="loginForm">
                <!-- Email -->
                <div class="mb-3">
                  <label class="form-label" for="email"> Email </label>

                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    required
                    placeholder="you@email.com"
                  />
                </div>

                <!-- Password -->
                <div class="mb-3">
                  <label class="form-label" for="password"> Password </label>

                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    required
                  />
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn btn-primary w-100">
                  Login / ចូល
                </button>
              </form>

              <p class="text-center mt-3 mb-0 small">
                No account?

                <a href="register.html"> Register </a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Login JavaScript -->
    <script type="module">
      import { loadSession, login } from "./js/auth.js";

      const form = document.getElementById("loginForm");

      const alertBox = document.getElementById("authAlert");

      // ========================================
      // SHOW MESSAGE
      // ========================================

      function showAlert(message, type = "danger") {
        alertBox.style.display = "block";

        alertBox.className = `alert alert-${type}`;

        alertBox.textContent = message;
      }

      // ========================================
      // CHECK EXISTING LOGIN
      // ========================================

      const user = await loadSession();

      if (user) {
        window.location.href = "index.html";
      }

      // ========================================
      // LOGIN
      // ========================================

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value;

        const password = document.getElementById("password").value;

        // ========================================
        // EMPTY CHECK
        // ========================================

        if (!email.trim() || !password) {
          showAlert("Please enter email and password.");

          return;
        }

        // ========================================
        // LOGIN
        // ========================================

        const result = await login(email, password);

        if (result.success) {
          showAlert("Login successful!", "success");

          setTimeout(function () {
            window.location.href = "index.html";
          }, 500);
        } else {
          showAlert(result.message || "Login failed.");
        }
      });
    </script>
  </body>
</html>
